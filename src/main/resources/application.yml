spring:
  application:
    name: seatflow

  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/seatflow?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:1234}"
    driver-class-name: com.mysql.cj.jdbc.Driver

  # The schema is owned by Flyway. Hibernate only verifies that the entities
  # match the tables that Flyway created, and fails fast when they drift apart.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Redis is not on the critical path for correctness: seat deduction is decided
  # by a conditional UPDATE in MySQL. Redis only gates the rate limiter and,
  # later in M3, caches roles. When it is unreachable the limiter fails open so
  # registration keeps working (product document R-02).
  data:
    redis:
      host: "${REDIS_HOST:localhost}"
      port: ${REDIS_PORT:6379}
      timeout: 200ms
      connect-timeout: 500ms
      client-type: jedis
      repositories:
        # Only JPA repositories exist in this project. Turning Redis repository
        # scanning off keeps startup logs clean and avoids Spring trying to
        # interpret JPA interfaces as Redis ones.
        enabled: false

  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

  ai:
    openai:
      # SiliconFlow exposes an OpenAI compatible API.
      base-url: "${SILICONFLOW_BASE_URL:https://api.siliconflow.cn}"
      api-key: "${SILICONFLOW_API_KEY:}"
      chat:
        options:
          model: "${SILICONFLOW_CHAT_MODEL:Qwen/Qwen3-8B}"
          temperature: 0.2
      embedding:
        options:
          model: "${SILICONFLOW_EMBEDDING_MODEL:BAAI/bge-m3}"
    vectorstore:
      type: redis
      redis:
        uri: "${REDIS_URI:redis://localhost:6379}"
        index: "seatflow-kb"
        prefix: "seatflow:kb:"
        initialize-schema: true

  # Notifications are asynchronous and must never block or fail a registration.
  # The registration transaction writes an outbox row; a separate dispatcher
  # publishes it here. When the broker is down, publishing fails and the outbox
  # row stays pending for the next attempt (product document FR-07, R-02).
  rabbitmq:
    host: "${RABBITMQ_HOST:localhost}"
    port: ${RABBITMQ_PORT:5672}
    username: "${RABBITMQ_USERNAME:seatflow}"
    password: "${RABBITMQ_PASSWORD:seatflow}"
    virtual-host: "${RABBITMQ_VHOST:/}"
    connection-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 500ms
          max-attempts: 3
          multiplier: 2

server:
  port: 8080

seatflow:
  security:
    jwt:
      # Override in every real environment. The development default is long
      # enough for HS256 but it is public knowledge, so it must never protect
      # anything but a local database.
      secret: "${JWT_SECRET:dev-only-secret-please-override-in-production-0123456789}"
      ttl: 2h
    role-cache:
      # Roles are read from Redis on every authenticated request, so a role
      # change takes effect on the next request. The TTL is only a safety net
      # for changes made outside the application.
      ttl: 30m
  registration:
    # How long a PENDING registration may hold a seat before the scanner
    # expires it. Product document BR-08; configurable on purpose (R-05).
    confirm-ttl: 15m
    timeout-scan-interval: 60s
    timeout-batch-size: 100
    rate-limit:
      # M3 decision: 5 requests per 10 seconds per user and 200 requests per
      # second across the whole registration endpoint.
      user-max-requests: 5
      user-window: 10s
      global-max-requests: 200
      global-window: 1s

  notification:
    # The dispatcher runs every 5s and publishes at most 100 due rows per tick.
    dispatch-interval: 5s
    batch-size: 100
    # Bounded exponential backoff: 5s, 10s, 20s, 40s ... capped at 5m.
    # The fifth failed attempt moves the row to FAILED instead of retrying.
    max-attempts: 5
    base-delay: 5s
    max-delay: 5m

  seat-gate:
    # Redis pre-reservation gateway. The database conditional UPDATE remains the
    # source of truth; this key only keeps rejected requests away from the hot row.
    key-ttl: 24h

  qa:
    top-k: 5
    similarity-threshold: 0.35
    knowledge-path: "classpath:knowledge/seatflow-knowledge.md"
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: seatflow

logging:
  level:
    com.seatflow: info
    # SQL logging stays available for debugging but must stay off the hot path:
    # it was one of the costs measured in the M3 baseline.
    org.hibernate.SQL: info
