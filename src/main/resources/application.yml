spring:
  application:
    name: seatflow

  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/seatflow?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver

  # The schema is owned by Flyway. Hibernate only verifies that the entities
  # match the tables that Flyway created, and fails fast when they drift apart.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Redis is not on the critical path for correctness: seat deduction is decided
  # by a conditional UPDATE in MySQL. Redis only gates the rate limiter and,
  # later in M3, caches roles. When it is unreachable the limiter fails open so
  # registration keeps working (product document R-02).
  data:
    redis:
      host: "${REDIS_HOST:localhost}"
      port: ${REDIS_PORT:6379}
      timeout: 2s
      repositories:
        # Only JPA repositories exist in this project. Turning Redis repository
        # scanning off keeps startup logs clean and avoids Spring trying to
        # interpret JPA interfaces as Redis ones.
        enabled: false

  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

seatflow:
  security:
    jwt:
      # Override in every real environment. The development default is long
      # enough for HS256 but it is public knowledge, so it must never protect
      # anything but a local database.
      secret: "${JWT_SECRET:dev-only-secret-please-override-in-production-0123456789}"
      ttl: 2h
  registration:
    # How long a PENDING registration may hold a seat before the scanner
    # expires it. Product document BR-08; configurable on purpose (R-05).
    confirm-ttl: 15m
    timeout-scan-interval: 60s
    timeout-batch-size: 100
    rate-limit:
      # M3 decision: 5 requests per 10 seconds per user and 200 requests per
      # second across the whole registration endpoint.
      user-max-requests: 5
      user-window: 10s
      global-max-requests: 200
      global-window: 1s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.seatflow: info
    org.hibernate.SQL: debug
