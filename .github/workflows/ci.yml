name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # clean is deliberate: incremental compilation can drop Lombok-generated
      # members and fail with NoSuchMethodError instead of a compile error.
      - name: Build and test
        run: mvn -B clean verify

      - name: Build container image
        run: docker build -t seatflow:${GITHUB_SHA} .

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
